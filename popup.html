<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>PRIVI-BROWSER</title>

    <style>

        body {
            width: 330px;
            padding: 18px;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
            margin-top: 6px;
        }

        #status {
            margin-top: 12px;
            font-size: 13px;
        }

        #resultImage {
            width: 100%;
            margin-top: 12px;
            border: 1px solid #ddd;
        }

    </style>

</head>


<body>

    <h2>🔐 PRIVI-BROWSER</h2>

    <p>
        Protect your screen before AI sees it.
    </p>


    <!-- =========================================
         PROTECT SCREEN
         ========================================= -->

    <button id="protectBtn">
        🛡️ Protect Screen
    </button>


    <hr>


    <!-- =========================================
         BROWSER AGENT
         ========================================= -->

    <h3>🤖 Browser Agent</h3>

    <p>
        Give the agent a task:
    </p>

    <input
        type="text"
        id="taskInput"
        placeholder="Example: Search Google for laptops"
    >


    <button id="runTaskBtn">
        ▶️ Run Task
    </button>


    <p id="status"></p>


    <img
        id="resultImage"
        style="display:none;"
    >


    <script src="popup.js"></script>

</body>

</html>
